name: julia_package

on:
  push:
    branches: [main, master]
    paths:
      - "julia_package/**"
      - ".github/workflows/test-julia-package.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "julia_package/**"
      - ".github/workflows/test-julia-package.yml"
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cookiecutter
        run: pip install cookiecutter

      - name: Generate project
        run: |
          cd /tmp
          cookiecutter --no-input "$GITHUB_WORKSPACE/julia_package"

      - name: Verify output
        run: |
          cd /tmp
          test -d MyPackage.jl
          test -f MyPackage.jl/AGENTS.md
          test -f MyPackage.jl/devenv.yaml
          test -f MyPackage.jl/devenv.nix
          test ! -e MyPackage.jl/Taskfile.yml
          test ! -e MyPackage.jl/Makefile
          test -f MyPackage.jl/panache.toml
          test -f MyPackage.jl/versionary.jsonc
