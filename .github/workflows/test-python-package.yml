name: python_package

on:
  push:
    branches: [main, master]
    paths:
      - "python_package/**"
      - ".github/workflows/test-python-package.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "python_package/**"
      - ".github/workflows/test-python-package.yml"
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cookiecutter
        run: pip install cookiecutter

      - name: Generate project
        run: |
          cd /tmp
          cookiecutter --no-input "$GITHUB_WORKSPACE/python_package"

      - name: Verify output
        run: |
          cd /tmp
          test -d pkg
          test -f pkg/AGENTS.md
          test -f pkg/devenv.yaml
          test -f pkg/devenv.nix
          test ! -e pkg/Taskfile.yml
          test ! -e pkg/Makefile
          test ! -e pkg/docs/Makefile
          test -f pkg/panache.toml
          test -f pkg/versionary.jsonc
