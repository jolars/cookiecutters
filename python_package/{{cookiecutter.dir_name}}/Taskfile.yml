version: "3"

tasks:
  format:
    desc: Format source and documentation
    cmds:
      - ruff format .
      - panache format .

  lint:
    desc: Lint source and documentation
    cmds:
      - ruff check .
      - panache lint .

  test:
    desc: Run tests
    cmds:
      - pytest

  docs:
    desc: Build documentation
    cmds:
      - make -C docs html

  check:
    desc: Run all required checks
    cmds:
      - ruff format --check .
      - ruff check .
      - pytest
      - make -C docs html
      - panache format --check .
      - panache lint .
